name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    e2e:
        uses: ./.github/workflows/e2e.yml

    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: node scripts/carrier-artifacts/verify.mjs
            - run: pnpm install --frozen-lockfile
            # Run all four. build passing while typecheck fails, and the reverse, have
            # both happened here.
            - run: pnpm -r build
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm format:check
            # What proves the verifier can fail; it refuses an unclean tree.
            - run: pnpm verify:artifacts:battery

    vectors:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - uses: actions/setup-go@v6
              with:
                  go-version: "1.26"
            - run: node scripts/carrier-artifacts/verify.mjs
            - run: pnpm install --frozen-lockfile
            - run: node scripts/carrier-artifacts/verify.mjs
            - run: pnpm vectors
            # A committed vectors.json that no longer matches the Go reference is
            # worse than none: every test would still pass, against stale bytes.
            - run: git diff --exit-code packages/covenant/test/vectors.json
            # arkadec ships only as a digest-pinned pre-release asset, so the tag
            # can move under us; this diff, not the tag, is what pins v2's bytes.
            - run: pnpm artifact
            - run: git diff --exit-code packages/covenant/contracts packages/covenant/src/dust-covenant-artifact.ts
            # Executes the v2 leaves in the emulator engine instead of comparing
            # bytes, so it fails when a leaf's semantics change while its bytes
            # still match a stale fixture. Clones the ref named in v2-vectors.json.
            - run: node packages/covenant/test/engine/run.mjs
