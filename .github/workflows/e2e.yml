name: e2e

on:
    workflow_call:
        inputs:
            ref:
                description: "Ref of this repo to test"
                required: false
                type: string
                default: ""
    workflow_dispatch:
        inputs:
            ref:
                description: "Ref of this repo to test (blank = the dispatch ref)"
                required: false
                type: string
                default: ""

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            AUTOMINE_INTERVAL: "0"
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - uses: actions/checkout@v5
              with:
                  repository: ArkLabsHQ/arkade-regtest
                  ref: master
                  fetch-depth: 1
                  path: arkade-regtest

            - name: Record arkade-regtest master
              run: |
                  REGTEST_SHA=$(git -C arkade-regtest rev-parse HEAD)
                  echo "arkade-regtest master: $REGTEST_SHA"

            - name: Remove the provenance checkout before the image build
              run: rm -rf arkade-regtest

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - run: node scripts/carrier-artifacts/verify.mjs

            - name: Install
              run: |
                  set -eu
                  for attempt in 1 2 3; do
                    if pnpm install --frozen-lockfile; then exit 0; fi
                    echo "install attempt ${attempt} failed; retrying"
                    sleep 5
                  done
                  exit 1

            - run: node scripts/carrier-artifacts/verify.mjs

            - name: Build packages for the release tarballs
              run: pnpm -r build

            - name: Run the complete production-artifact E2E suite
              run: pnpm e2e:stack

            - uses: actions/upload-artifact@v4
              if: ${{ always() }}
              with:
                  name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      e2e-artifacts/stack.json
                      e2e-results.json
                      e2e-artifacts/results.json
                      e2e-artifacts/taxi.log
                      e2e-artifacts/stack.log
                      e2e-artifacts/failure.log
                      e2e-artifacts/proxy-events.json
                      e2e-artifacts/boundary-diagnostics.jsonl
                      e2e-artifacts/cltv-evidence.json
                      e2e-artifacts/isolated/stack.json
                      e2e-artifacts/isolated/results.json
                      e2e-artifacts/isolated/taxi.log
                      e2e-artifacts/isolated/stack.log
                      e2e-artifacts/isolated/failure.log
                      e2e-artifacts/isolated/proxy-events.json
                      e2e-artifacts/isolated/boundary-diagnostics.jsonl
                      e2e-artifacts/isolated/unilateral-exit.json
                  if-no-files-found: warn

    client-wallet:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: actions/checkout@v5
              with:
                  repository: ArkLabsHQ/arkade-regtest
                  ref: c364ea8af124ca5f75d62d6cabf6436481e10dcc
                  path: arkade-regtest
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: node scripts/carrier-artifacts/verify.mjs
            - run: pnpm install --frozen-lockfile
            - run: pnpm -r build
            - run: docker build -t arkade-taxi:regtest .
            - run: pnpm regtest:up:client
            - run: pnpm regtest:test:client
            - name: Capture shared-regtest logs
              if: failure()
              run: |
                  for service in arkd arkd-wallet emulator taxi; do
                    docker logs --tail 200 "$service" 2>&1 || true
                  done
            - name: Stop shared-regtest
              if: always()
              run: pnpm regtest:down:client
